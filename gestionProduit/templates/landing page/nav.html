{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.js"
        integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>
    <script src="{% static 'js/hero.js' %}"></script>
</head>

<body>


    <nav
        class="z-50 shadow-sm m-2 md:m-3 rounded-lg fixed top-0 left-0 right-0 p-3 md:p-4 flex justify-between items-center bg-white/5 backdrop-blur-xl border-b border-white/10 shadow-2xl">
        <!-- Logo -->
        <a href="/" class="text-xl md:text-2xl font-black text-white flex items-center tracking-tight">
            <i class="fa-solid fa-store mr-2 text-teal-400"></i>
            <span class="bg-gradient-to-r from-teal-400 to-cyan-400 bg-clip-text text-transparent">KeyaKou</span>
        </a>

        <!-- Menu Desktop -->
        <div class="hidden lg:flex items-center space-x-1">
            <a href="{% url 'gestionProduit:affichage_produit' %}"
                class="px-5 py-2 text-gray-300 hover:text-white font-medium transition-all hover:bg-white/10 rounded-lg backdrop-blur-sm">
                Produits
            </a>
            <a href="#tendances"
                class="px-5 py-2 text-gray-300 hover:text-white font-medium transition-all hover:bg-white/10 rounded-lg backdrop-blur-sm">
                Tendances
            </a>

            <!-- Input de recherche intégré -->
            <form action="{% url 'gestionProduit:recherche_produit' %}" method="GET" class="relative ml-4">
                <input type="text" name="q" placeholder="Rechercher un produit..."
                    class="w-64 bg-white/10 border border-white/20 rounded-lg px-4 py-2.5 pl-10 pr-12 text-white placeholder-gray-400 focus:border-teal-500 focus:outline-none focus:bg-white/5 transition-all backdrop-blur-sm font-medium">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                <button type="submit"
                    class="absolute right-2 top-1/2 -translate-y-1/2 bg-teal-500 hover:bg-teal-400 text-white w-8 h-8 rounded-md transition-all flex items-center justify-center hover:scale-105">
                    <i class="fa-solid fa-magnifying-glass text-sm"></i>
                </button>
            </form>

            <a href="{% url 'gestionProduit:dashboard' %}"
                class="flex items-center space-x-2 border-2 border-teal-400 text-teal-400 px-5 py-2.5 rounded-lg hover:bg-teal-400/10 transition-all relative font-medium backdrop-blur-sm">
                <div
                    class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs font-bold shadow-lg">
                    0</div>
                <i class="fa-solid fa-cart-shopping"></i>
                <span>Panier</span>
            </a>
            <a href="{% url 'gestionProduit:dashboard' %}"
                class="flex items-center space-x-2 bg-white/10 text-white px-5 py-2.5 rounded-lg hover:bg-white/20 transition-all font-medium backdrop-blur-sm">
                <i class="fa-solid fa-user"></i>
                <span>Connexion</span>
            </a>
        </div>

        <!-- Menu Mobile (Boutons principaux) -->
        <div class="flex lg:hidden items-center space-x-2">
            <a href="{% url 'gestionProduit:recherche_produit' %}"
                class="w-10 h-10 bg-teal-500 text-white rounded-lg hover:bg-teal-400 transition-all flex items-center justify-center shadow-lg shadow-teal-500/30">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <a href="{% url 'gestionProduit:dashboard' %}"
                class="w-10 h-10 border-2 border-teal-400 text-teal-400 rounded-lg hover:bg-teal-400/10 transition-all relative flex items-center justify-center backdrop-blur-sm">
                <div
                    class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-4 h-4 flex items-center justify-center text-xs font-bold">
                    0</div>
                <i class="fa-solid fa-cart-shopping"></i>
            </a>
            <button id="mobileMenuBtn"
                class="w-10 h-10 bg-white/10 text-white rounded-lg hover:bg-white/20 transition-all flex items-center justify-center backdrop-blur-sm">
                <i class="fa-solid fa-bars"></i>
            </button>
        </div>
    </nav>

    <!-- Menu Mobile Overlay -->
    <div id="mobileMenu" class="fixed inset-0 bg-black/95 backdrop-blur-xl z-40 hidden">
        <div class="flex flex-col items-center justify-center h-full space-y-6 p-6">
            <button id="closeMenuBtn"
                class="absolute top-6 right-6 w-12 h-12 bg-white/10 text-white rounded-lg hover:bg-white/20 transition-all flex items-center justify-center">
                <i class="fa-solid fa-times text-xl"></i>
            </button>

            <a href="#produits"
                class="mobile-menu-link text-white text-3xl font-bold hover:text-teal-400 transition-all">Produits</a>
            <a href="#tendances"
                class="mobile-menu-link text-white text-3xl font-bold hover:text-teal-400 transition-all">Tendances</a>
            <a href="{% url 'gestionProduit:recherche_produit' %}"
                class="mobile-menu-link text-white text-3xl font-bold hover:text-teal-400 transition-all">Recherche</a>
            <a href="{% url 'gestionProduit:dashboard' %}"
                class="mobile-menu-link text-white text-3xl font-bold hover:text-teal-400 transition-all">Panier</a>
            <a href="{% url 'gestionProduit:dashboard' %}"
                class="bg-gradient-to-r from-teal-500 to-cyan-500 text-white px-10 py-4 rounded-full font-bold text-xl hover:shadow-2xl hover:shadow-teal-500/50 transition-all">
                Connexion
            </a>
        </div>
    </div>



    {%block js %}
    <script>
        // Toggle user menu
        const userMenuButton = document.getElementById('user-menu-button');
        const userMenu = document.getElementById('user-menu');
        userMenuButton.addEventListener('click', () => {
            userMenu.classList.toggle('hidden');
        });

        // Toggle search input
        const searchButton = document.getElementById('search-button');
        const searchInput = document.getElementById('search-input');
        searchButton.addEventListener('click', () => {
            searchInput.classList.toggle('hidden');
        });
    </script>

    <script>
        // Menu mobile toggle
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const closeMenuBtn = document.getElementById('closeMenuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileMenuLinks = document.querySelectorAll('.mobile-menu-link');

        mobileMenuBtn?.addEventListener('click', () => {
            mobileMenu?.classList.remove('hidden');
        });

        closeMenuBtn?.addEventListener('click', () => {
            mobileMenu?.classList.add('hidden');
        });

        // Fermer le menu quand on clique sur un lien
        mobileMenuLinks.forEach(link => {
            link.addEventListener('click', () => {
                mobileMenu?.classList.add('hidden');
            });
        });
    </script>

    {% endblock js %}



</body>

</html>
